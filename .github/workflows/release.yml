# Package the addon and upload it to CurseForge (and a GitHub release) when a version tag is pushed.
name: Release

on:
  push:
    tags:
      - "v*"

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write   # lets the packager create the GitHub release
    env:
      CF_API_KEY: ${{ secrets.CF_API_KEY }}
      GITHUB_OAUTH: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # full history, for the changelog

      - uses: BigWigsMods/packager@v2
